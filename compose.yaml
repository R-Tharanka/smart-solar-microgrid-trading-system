services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: ${MONGODB_CONNECTION_STRING}
      MongoDb__DatabaseName: ${MONGODB_DATABASE_NAME:-smart_solar_microgrid}
      Jwt__Issuer: SmartSolarMicrogrid.Api
      Jwt__Audience: SmartSolarMicrogrid.Clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      BootstrapAdmin__Enabled: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "5080:8080"
